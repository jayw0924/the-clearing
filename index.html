<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080c">
<title>the clearing</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; min-height: 100vh;
    background: #07080c !important; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; background: #07080c; cursor: none; }
  #err { position: fixed; left: 10px; bottom: 8px; color: #8a5a4a; font: 12px/1.4 ui-monospace, monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="A night road. You are already walking. Lean to change pace or turn back."></canvas>
<div id="err"></div>
<script>
/* the clearing — a night road.
   side view, silhouettes, one warm light. you are already walking.
   lean to speed up, slow down, or turn around. no jumping. no strobes. */
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const qs = new URLSearchParams(location.search);
  const DEBUG = qs.has('debug');
  const FREEZE = qs.has('freeze');
  const errEl = document.getElementById('err');
  window.addEventListener('error', (e) => { errEl.textContent = e.message || 'failed'; });

  const LOOP = 20;
  const view = { w: 1, h: 1, dpr: 1 };
  let playerX = 2.4;
  let vel = 0.42;
  let velSmooth = 0.42;
  let facing = 1;
  let variant = 0;
  let loops = 0;
  let steer = 0;
  const mouse = { x: -1, y: -1, inside: false };
  const held = {};
  let last = performance.now();
  let pageT0 = performance.now();
  let grain, grainPat;
  let muted = false;
  let figureFar = 0;
  let nextHead = performance.now() + 22000;

  let actx, master, masterFilter, delaySend, noiseBuf, driftGain;
  let appliedDrift = -1, eventUntil = 0, humGain;

  if (qs.has('x')) playerX = parseFloat(qs.get('x')) || playerX;

  const stars = Array.from({ length: 42 }, (_, i) => ({
    x: hash(i, 1), y: hash(i, 2) * 0.42,
    r: 0.4 + hash(i, 3) * 0.9,
    a: 0.05 + hash(i, 4) * 0.22,
    ph: hash(i, 5) * 6,
  }));

  function hash(n, k) {
    const x = Math.sin(n * 127.1 + k * 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function wrap(x) { return ((x % LOOP) + LOOP) % LOOP; }

  function makeGrain() {
    grain = document.createElement('canvas');
    grain.width = 140; grain.height = 140;
    const g = grain.getContext('2d');
    const img = g.createImageData(140, 140);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 80 + Math.random() * 160;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = n;
      img.data[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
  }
  function resize() {
    view.dpr = Math.min(devicePixelRatio || 1, 1.5);
    view.w = Math.max(2, innerWidth);
    view.h = Math.max(2, innerHeight);
    canvas.width = Math.floor(view.w * view.dpr);
    canvas.height = Math.floor(view.h * view.dpr);
    grainPat = null;
  }

  function span() { return Math.min(view.w, view.h); }
  function groundY(xScreen, now) {
    const u = span();
    return view.h * 0.70 + Math.sin(xScreen * 0.004 + now * 0.00005) * u * 0.012;
  }
  function project(wx, parallax) {
    const cam = playerX - 2.6;
    const units = 9.2;
    return ((wx - cam) * (parallax == null ? 1 : parallax) - 0) / units * view.w;
  }
  function sxOf(wx) {
    const cam = playerX - 2.6;
    return (wx - cam) / 9.2 * view.w;
  }

  function startAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      actx = new AC();
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      master = actx.createGain(); master.gain.value = 0.34;
      masterFilter = actx.createBiquadFilter();
      masterFilter.type = 'lowpass'; masterFilter.frequency.value = 7000;
      master.connect(masterFilter); masterFilter.connect(actx.destination);
      humGain = actx.createGain(); humGain.gain.value = 0.04;
      [59.5, 60.5].forEach((f, i) => {
        const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = actx.createGain(); g.gain.value = i ? 0.8 : 1;
        o.connect(g); g.connect(humGain); o.start();
      });
      humGain.connect(master);
      const room = actx.createBufferSource(); room.buffer = noiseBuf; room.loop = true;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
      const rg = actx.createGain(); rg.gain.value = 0.05;
      room.connect(lp); lp.connect(rg); rg.connect(master); room.start();
      delaySend = actx.createGain();
      const delay = actx.createDelay(); delay.delayTime.value = 0.21;
      const fb = actx.createGain(); fb.gain.value = 0.28;
      const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 1200;
      delaySend.connect(delay); delay.connect(dlp); dlp.connect(fb); fb.connect(delay); dlp.connect(master);
      const ds = actx.createBufferSource(); ds.buffer = noiseBuf; ds.loop = true;
      const dsf = actx.createBiquadFilter(); dsf.type = 'bandpass'; dsf.frequency.value = 380;
      driftGain = actx.createGain(); driftGain.gain.value = 0.01;
      ds.connect(dsf); dsf.connect(driftGain); driftGain.connect(master); ds.start();
      setTimeout(() => drip(), 8000);
      setTimeout(() => wind(), 18000);
      setTimeout(() => owlCall(), 30000);
      setTimeout(ambience, 42000);
    } catch (e) { actx = null; }
  }
  function tone(a, b, t, dur, gain, pan) {
    if (!actx || muted) return;
    const o = actx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(Math.max(40, a), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, b), t + dur);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const p = actx.createStereoPanner(); p.pan.value = pan || 0;
    o.connect(g); g.connect(p); p.connect(master);
    if (delaySend) g.connect(delaySend);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function canEv() { return actx && actx.currentTime > eventUntil && !muted; }
  function owlCall() {
    if (!canEv()) return;
    eventUntil = actx.currentTime + 2.2;
    tone(600, 360, actx.currentTime, 0.38, 0.035, -0.35);
    tone(500, 330, actx.currentTime + 0.55, 0.32, 0.028, -0.3);
  }
  function drip() {
    if (!canEv()) return;
    eventUntil = actx.currentTime + 0.4;
    tone(1100, 420, actx.currentTime, 0.1, 0.02, 0.25);
  }
  function wind() {
    if (!canEv() || !noiseBuf) return;
    eventUntil = actx.currentTime + 5;
    const t = actx.currentTime;
    const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(240, t);
    lp.frequency.linearRampToValueAtTime(700, t + 1.5);
    lp.frequency.linearRampToValueAtTime(180, t + 4.2);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.04, t + 1);
    g.gain.linearRampToValueAtTime(0.0001, t + 4.4);
    s.connect(lp); lp.connect(g); g.connect(master);
    s.start(t); s.stop(t + 4.6);
  }
  function ambience() {
    if (!actx) return;
    setTimeout(() => {
      const r = Math.random();
      if (r < 0.3) owlCall();
      else if (r < 0.55) drip();
      else if (r < 0.8) wind();
      else tone(120, 80, actx.currentTime, 1.8, 0.02, 0);
      ambience();
    }, 12000 + Math.random() * 18000);
  }

  function drawFir(x, base, h, seed) {
    if (h < 16) return;
    ctx.save();
    ctx.translate(x, base);
    ctx.fillStyle = '#070908';
    ctx.beginPath();
    const j = (k) => (hash(seed, k) - 0.5) * h * 0.05;
    ctx.moveTo(j(1), -h);
    ctx.quadraticCurveTo(-h * 0.08 + j(2), -h * 0.72, -h * 0.16 + j(3), -h * 0.42);
    ctx.quadraticCurveTo(-h * 0.2, -h * 0.18, -h * 0.05, 0);
    ctx.lineTo(h * 0.06, 0);
    ctx.quadraticCurveTo(h * 0.18 + j(4), -h * 0.2, h * 0.12 + j(5), -h * 0.55);
    ctx.quadraticCurveTo(h * 0.05, -h * 0.8, j(6), -h);
    ctx.fill();
    ctx.fillStyle = '#050706';
    ctx.fillRect(-h * 0.015, -h * 0.08, h * 0.03, h * 0.1);
    ctx.restore();
  }

  function drawCoat(x, y, s, flip, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha;
    ctx.scale(flip, 1);
    ctx.fillStyle = '#9a8c78';
    ctx.beginPath();
    ctx.moveTo(-s * 0.14, 0);
    ctx.lineTo(-s * 0.1, -s * 0.62);
    ctx.quadraticCurveTo(0, -s * 0.78, s * 0.1, -s * 0.62);
    ctx.lineTo(s * 0.14, 0);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -s * 0.78, s * 0.075, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(170,140,96,0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(s * 0.08, -s * 0.6);
    ctx.lineTo(s * 0.12, -s * 0.05);
    ctx.stroke();
    ctx.restore();
  }

  function drawChair(x, y, s, lit) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = lit > 0.3 ? '#241c14' : '#100e0c';
    ctx.fillRect(-s * 0.34, -s * 0.16, s * 0.7, s * 0.1);
    ctx.fillRect(-s * 0.28, -s * 0.72, s * 0.08, s * 0.6);
    ctx.fillRect(s * 0.12, -s * 0.7, s * 0.07, s * 0.56);
    ctx.fillRect(-s * 0.3, -s * 0.72, s * 0.5, s * 0.07);
    ctx.fillRect(-s * 0.32, -s * 0.08, s * 0.06, s * 0.16);
    ctx.fillRect(s * 0.22, -s * 0.08, s * 0.06, s * 0.16);
    if (lit > 0.2) {
      ctx.fillStyle = `rgba(196,160,106,${0.25 + lit * 0.35})`;
      ctx.fillRect(-s * 0.34, -s * 0.16, s * 0.5, 1.4);
    }
    ctx.restore();
  }

  function drawStumpCup(x, y, s, near, now, cup) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#16110e';
    ctx.beginPath();
    ctx.ellipse(0, -s * 0.08, s * 0.28, s * 0.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillRect(-s * 0.22, -s * 0.08, s * 0.44, s * 0.16);
    if (cup !== 'gone') {
      ctx.fillStyle = near > 0.4 ? '#7a7468' : '#3e3a34';
      ctx.fillRect(s * 0.02, -s * 0.28, s * 0.14, s * 0.18);
      ctx.fillRect(-s * 0.0, -s * 0.32, s * 0.18, s * 0.06);
    }
    ctx.restore();
    if (near > 0.35 && cup !== 'gone' && cup !== 'tipped') {
      ctx.strokeStyle = `rgba(180,176,168,${0.18 * near})`;
      ctx.lineWidth = 1;
      const o = Math.sin(now * 0.001) * 3;
      ctx.beginPath();
      ctx.moveTo(x + s * 0.08, y - s * 0.32);
      ctx.bezierCurveTo(x - 4 + o, y - s * 0.6, x + 6, y - s * 0.8, x + o, y - s);
      ctx.stroke();
    }
  }

  function drawCloth(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = '#3a1820';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-s * 0.12, s * 0.35);
    ctx.lineTo(-s * 0.05, s * 0.7);
    ctx.lineTo(-s * 0.16, s * 0.95);
    ctx.lineTo(0.02 * s, s * 0.72);
    ctx.lineTo(s * 0.08, s * 0.4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function sceneState() {
    const v = ((variant % 5) + 5) % 5;
    return {
      v,
      cup: ['up', 'full', 'tipped', 'gone', 'up'][v],
      owl: v !== 2,
      clothShift: (v - 2) * 0.35,
      window: v === 1 || v === 4 || loops > 0,
    };
  }

  function bulbs() {
    const out = [];
    const base = Math.floor(playerX / LOOP) - 1;
    for (let n = base; n <= base + 2; n++) out.push(n * LOOP + 5.4);
    return out;
  }

  function update(dt, now) {
    let input = 0;
    if (mouse.inside) {
      const nx = (mouse.x / view.w - 0.5) * 2;
      if (Math.abs(nx) > 0.08) input = clamp(nx * 1.1, -1, 1);
    }
    if (held.arrowright || held.d) input += 1;
    if (held.arrowleft || held.a) input -= 1;
    if (held.arrowup || held.w) input += 0.4;
    input = clamp(input, -1, 1);
    steer += (input - steer) * (1 - Math.exp(-dt / 280));
    const target = 0.38 + steer * 0.72;
    if (!FREEZE) {
      velSmooth += (target - velSmooth) * (1 - Math.exp(-dt / 360));
      playerX += velSmooth * dt / 1000;
      if (playerX > (loops + 1) * LOOP + 2.4) {
        loops += 1;
        variant = (variant + 1) % 5;
      }
      if (playerX < loops * LOOP - 4 && loops > 0) {
        loops -= 1;
        variant = (variant + 4) % 5;
      }
    }
    facing = velSmooth >= -0.02 ? 1 : -1;
    const cycle = (now / 1000) % 28;
    const wantFig = cycle > 8 && cycle < 16 && Math.abs(steer) < 0.45 ? 0.45 : 0;
    figureFar += (wantFig - figureFar) * (1 - Math.exp(-dt / 700));
    if (actx && humGain) {
      let near = 0;
      for (const b of bulbs()) near = Math.max(near, clamp(1 - Math.abs(b - playerX) / 3.2, 0, 1));
      humGain.gain.setTargetAtTime(muted ? 0 : 0.02 + near * 0.05, actx.currentTime, 0.2);
      if (driftGain) driftGain.gain.setTargetAtTime(muted ? 0 : 0.008 + Math.abs(velSmooth) * 0.02, actx.currentTime, 0.2);
    }
  }

  function draw(now) {
    const { w, h } = view;
    const st = sceneState();
    const u = span();
    ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
    ctx.globalAlpha = 1;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#07080e');
    sky.addColorStop(0.55, '#10141a');
    sky.addColorStop(1, '#141210');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);
    for (const s of stars) {
      ctx.fillStyle = `rgba(200,196,186,${s.a * (0.8 + 0.2 * Math.sin(now * 0.001 + s.ph))})`;
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * h, s.r, 0, 7);
      ctx.fill();
    }

    const gy = h * 0.72;
    const g = ctx.createLinearGradient(0, gy - 40, 0, h);
    g.addColorStop(0, 'rgba(10,12,11,0)');
    g.addColorStop(0.2, '#0c0e0c');
    g.addColorStop(1, '#070605');
    ctx.fillStyle = g;
    ctx.fillRect(0, gy - 50, w, h);

    const road = ctx.createLinearGradient(0, gy, 0, h);
    road.addColorStop(0, '#14110e');
    road.addColorStop(1, '#0a0908');
    ctx.fillStyle = road;
    ctx.beginPath();
    ctx.moveTo(0, gy + 18);
    for (let x = 0; x <= w; x += 40) {
      const wx = playerX - 2.6 + (x / w) * 9.2;
      ctx.lineTo(x, gy + 8 + Math.sin(wx * 0.7) * 6);
    }
    ctx.lineTo(w, h);
    ctx.lineTo(0, h);
    ctx.fill();

    const loop0 = Math.floor((playerX - 6) / LOOP);
    for (let n = loop0; n <= loop0 + 2; n++) {
      for (let i = 0; i < 8; i++) {
        const wx = n * LOOP + i * 2.4 + hash(i, 3) * 0.8;
        const x = sxOf(wx * 0.35 + playerX * 0.65);
        if (x < -200 || x > w + 200) continue;
        const hh = u * (0.22 + hash(i, 5) * 0.16);
        ctx.globalAlpha = 0.55;
        drawFir(x, gy + 10, hh, i + 20);
        ctx.globalAlpha = 1;
      }
    }

    for (let n = loop0; n <= loop0 + 2; n++) {
      for (let i = 0; i < 7; i++) {
        const wx = n * LOOP + i * 2.7 + hash(i, 8) * 1.1;
        const x = sxOf(wx);
        if (x < -180 || x > w + 180) continue;
        const base = groundY(x, now);
        const hh = u * (0.34 + hash(i, 9) * 0.38);
        drawFir(x, base + 6, hh, i + n * 5 + 3);
      }
    }

    for (const bx of bulbs()) {
      const x = sxOf(bx);
      if (x < -300 || x > w + 300) continue;
      const y = h * 0.30 + Math.sin(now / 1600 + bx) * 6;
      const base = groundY(x, now);
      const near = clamp(1 - Math.abs(bx - playerX) / 2.8, 0, 1);
      ctx.strokeStyle = 'rgba(36,32,28,0.7)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x - u * 0.35, y - 20);
      ctx.quadraticCurveTo(x, y + 8, x + u * 0.38, y - 28);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y + 4);
      ctx.lineTo(x, y + 18);
      ctx.stroke();
      const glow = ctx.createRadialGradient(x, y + 22, 0, x, y + 22, u * 0.42);
      glow.addColorStop(0, `rgba(210,170,110,${0.28 + near * 0.12})`);
      glow.addColorStop(0.35, `rgba(90,60,30,${0.08 + near * 0.05})`);
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y + 30, u * 0.42, 0, 7);
      ctx.fill();
      const pool = ctx.createRadialGradient(x, base, 0, x, base, u * 0.28);
      pool.addColorStop(0, `rgba(80,54,28,${0.35 + near * 0.15})`);
      pool.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = pool;
      ctx.beginPath();
      ctx.ellipse(x, base + 8, u * 0.26, u * 0.05, 0, 0, 7);
      ctx.fill();
      ctx.fillStyle = `rgba(242,224,196,${0.85})`;
      ctx.beginPath();
      ctx.ellipse(x, y + 20, 3.2, 5, 0, 0, 7);
      ctx.fill();

      const cx = sxOf(bx + 0.85);
      const chairNear = clamp(1 - Math.abs(bx + 0.85 - playerX) / 1.6, 0, 1);
      drawChair(cx, groundY(cx, now), u * 0.11, chairNear);

      const stumpX = sxOf(bx + 2.1);
      drawStumpCup(stumpX, groundY(stumpX, now), u * 0.16, clamp(1 - Math.abs(bx + 2.1 - playerX) / 1.4, 0, 1), now, st.cup);
    }

    for (let n = loop0; n <= loop0 + 2; n++) {
      const tx = n * LOOP + 11.2 + st.clothShift;
      const x = sxOf(tx);
      if (x < -100 || x > w + 100) continue;
      const base = groundY(x, now);
      drawFir(x, base, u * 0.55, 40 + n);
      ctx.strokeStyle = '#14110e';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 4, base - u * 0.34);
      ctx.quadraticCurveTo(x + u * 0.06, base - u * 0.3, x + u * 0.1, base - u * 0.26);
      ctx.stroke();
      drawCloth(x + u * 0.1, base - u * 0.26, u * 0.16);
      if (st.owl && Math.abs(tx - playerX) < 2.2) {
        const eyes = clamp(1 - Math.abs(tx - playerX) / 1.8, 0, 1);
        ctx.fillStyle = `rgba(196,148,78,${0.15 + eyes * 0.55})`;
        ctx.beginPath();
        ctx.arc(x - 6, base - u * 0.36, 1.6, 0, 7);
        ctx.arc(x + 2, base - u * 0.35, 1.6, 0, 7);
        ctx.fill();
      }
    }

    if (st.window) {
      for (let n = loop0; n <= loop0 + 2; n++) {
        const wx = n * LOOP + 15.5;
        const x = sxOf(wx);
        if (x < 0 || x > w) continue;
        const dist = Math.abs(wx - playerX);
        const a = dist < 1.2 ? 0.05 : 0.35;
        ctx.fillStyle = `rgba(210,160,90,${a})`;
        ctx.fillRect(x, h * 0.48, 5, 7);
      }
    }

    if (figureFar > 0.04 && facing > 0) {
      const x = w * 0.78;
      const y = groundY(x, now);
      drawCoat(x, y, u * 0.055, 1, figureFar * 0.7);
    }

    const px = sxOf(playerX);
    const py = groundY(px, now);

    ctx.fillStyle = '#050706';
    ctx.beginPath();
    ctx.moveTo(-20, h * 0.55);
    ctx.quadraticCurveTo(w * 0.08, h * 0.62, w * 0.02, h + 10);
    ctx.lineTo(-20, h + 10);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(w + 20, h * 0.08);
    ctx.quadraticCurveTo(w * 0.82, h * 0.16, w * 0.9, h * 0.28);
    ctx.quadraticCurveTo(w * 0.96, h * 0.12, w + 20, 0);
    ctx.fill();

    drawCoat(px, view.h * 0.735, u * 0.12, facing, 1);

    const vig = ctx.createRadialGradient(w * 0.5, h * 0.5, u * 0.2, w * 0.5, h * 0.55, Math.max(w, h) * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.7, 'rgba(0,0,0,0.18)');
    vig.addColorStop(1, 'rgba(0,0,0,0.62)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    if (grain) {
      if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
      ctx.save();
      ctx.globalAlpha = 0.055;
      ctx.translate((now * 0.02) % 140, (now * 0.01) % 140);
      ctx.fillStyle = grainPat;
      ctx.fillRect(-140, -140, w + 280, h + 280);
      ctx.restore();
    }

    if (DEBUG) {
      ctx.fillStyle = '#cbb';
      ctx.font = '12px monospace';
      ctx.fillText(`x ${playerX.toFixed(2)} v ${velSmooth.toFixed(2)} loop ${loops}`, 12, 18);
    }
  }

  canvas.addEventListener('pointermove', (e) => {
    const r = canvas.getBoundingClientRect();
    mouse.x = e.clientX - r.left;
    mouse.y = e.clientY - r.top;
    mouse.inside = true;
  });
  canvas.addEventListener('pointerleave', () => { mouse.inside = false; });
  canvas.addEventListener('pointerdown', () => startAudio());
  window.addEventListener('keydown', (e) => {
    startAudio();
    held[e.key.toLowerCase()] = true;
    if (e.key === 'm' || e.key === 'M') muted = !muted;
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { held[e.key.toLowerCase()] = false; });
  window.addEventListener('resize', resize);
  canvas.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });

  makeGrain();
  resize();
  requestAnimationFrame(function frame(now) {
    try {
      const dt = Math.min(40, now - last);
      last = now;
      update(dt, now);
      draw(now);
    } catch (err) {
      errEl.textContent = err.message || String(err);
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
